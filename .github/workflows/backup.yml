name: Daily Backup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create backup
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p backups
          zip -r "backups/backup-$DATE.zip" . -x "*.git*" "backups/*"
      - name: Commit backup
        run: |
          git config user.name "Backup Bot"
          git config user.email "backup@gmppayroll.com"
          git add backups/
          git commit -m "Automated backup $(date +%Y-%m-%d)" || exit 0
          git push
